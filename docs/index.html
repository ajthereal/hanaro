<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hanaro">
<title>Hanaro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="banner" role="status" aria-live="polite" hidden></div>

<section id="setup" hidden>
  <div class="setup-card">
    <div class="logo" aria-hidden="true"><img src="icon-192.png" alt="" width="64" height="64"></div>
    <h1>Hanaro</h1>
    <p class="muted">Paste the link and key you were given. They stay on this device only.</p>
    <label for="setupUrl">Link</label>
    <input id="setupUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="setupKey">Key</label>
    <input id="setupKey" type="password" autocomplete="off" autocapitalize="off" placeholder="Your personal key">
    <button id="setupGo" class="primary">Connect</button>
    <p id="setupMsg" class="err" role="alert"></p>
  </div>
</section>

<div id="app" hidden>
  <header>
    <div class="who">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div><div class="tiny muted">Welcome</div><div id="whoName" class="name"></div></div>
    </div>
    <button id="syncPill" class="pill" aria-label="Refresh">Syncing…</button>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav id="nav" hidden aria-label="Main">
  <button data-go="home" aria-label="Home"></button>
  <button data-go="review" aria-label="Review"></button>
  <button id="addBtn" class="add" aria-label="Add transaction">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button data-go="spending" aria-label="Spending"></button>
  <button data-go="status" aria-label="Status"></button>
</nav>

<div id="sheetBack" hidden></div>
<section id="sheet" hidden role="dialog" aria-modal="true" aria-label="Add transaction">
  <div class="addtop">
    <button id="addCancel" class="roundx" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <label for="addAmount" class="sr">Amount in rupiah</label>
    <div class="amtwrap"><span class="amtrp">Rp</span><input id="addAmount" inputmode="numeric" autocomplete="off" placeholder="0"></div>
    <div class="seg" role="tablist">
      <button id="kindSpent" class="on" role="tab">Spent</button>
      <button id="kindGot" role="tab">Received</button>
      <button id="kindHeld" role="tab">Held for others</button>
    </div>
  </div>
  <div class="fields">
    <div class="field"><label for="addPayee" id="payeeLabel">Payee</label><input id="addPayee" autocomplete="off" autocapitalize="words" placeholder="Who or what">
      <div id="payeeSug" class="sugs" hidden></div>
      <div id="geoNote" class="geo" hidden><span id="geoText"></span> <button type="button" id="geoClear" class="link">Clear</button></div></div>
    <button id="catBtn" class="field fbtn" type="button"><span class="fl" id="catLabel">Category</span><span class="fv" id="catVal">Choose</span><span class="chev" aria-hidden="true">›</span></button>
    <div id="newTypeWrap" class="field" hidden><label for="addNewType">Name of the new kind</label><input id="addNewType" autocomplete="off" placeholder="For example, Seminar fees"></div>
    <p id="heldHint" class="note" hidden>Money someone gave you to pass on. It is not your income and not counted as spending.</p>
    <div class="field"><label for="addAcc" id="accLabel">Account</label><select id="addAcc"></select></div>
    <div class="field"><label for="addMemo">Memo (optional)</label><input id="addMemo" autocomplete="off"></div>
    <div class="field"><span class="fl">Receipt photo (optional, saved to PT_Receipts)</span><button id="photoBtn" class="link" type="button">Take or choose a photo</button><input id="photoIn" type="file" accept="image/*" hidden><span id="photoMsg" class="note"></span></div>
  </div>
  <p id="addMsg" class="err" role="alert"></p>
  <button id="addSave" class="primary savefab">Save</button>
</section>

<section id="picker" hidden role="dialog" aria-modal="true" aria-label="Choose a category">
  <div class="pickhead"><button id="pickBack" class="roundx" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div class="pickttl" id="pickTitle">Category</div></div>
  <input id="pickSearch" type="search" placeholder="Search" autocomplete="off">
  <div id="pickList"></div>
</section>


<section id="planEdit" hidden role="dialog" aria-modal="true" aria-label="Plan item">
  <div class="pickhead"><button id="planBack" class="roundx" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><div class="pickttl" id="planTitle">Plan item</div></div>
  <div class="fields" style="margin:0">
    <div class="field" id="pfName"><label for="planName">Name</label><input id="planName" autocomplete="off" autocapitalize="words" placeholder="For example, Rent"></div>
    <div class="field" id="pfAmount"><label for="planAmount" id="planAmountLabel">Amount per month (Rp)</label><input id="planAmount" inputmode="numeric" autocomplete="off" placeholder="0"></div>
    <div class="field" id="pfDue"><label for="planDue">Due day of the month (optional)</label><input id="planDue" inputmode="numeric" autocomplete="off" placeholder="For example, 1"></div>
    <div class="field" id="pfTarget"><label for="planTarget">Target amount (Rp)</label><input id="planTarget" inputmode="numeric" autocomplete="off" placeholder="0"></div>
    <div class="field" id="pfEvery"><label for="planEvery">Covers how many months</label><input id="planEvery" inputmode="numeric" autocomplete="off" placeholder="For example, 12"></div>
    <div class="field" id="pfCat"><label for="planCat">Category it is spent in (optional)</label><select id="planCat"></select></div>
  </div>
  <p id="planHint" class="note" style="margin:12px 4px 0"></p>
  <p id="planMsg" class="err" role="alert"></p>
  <button id="planSave" class="primary" style="margin-top:8px">Save</button>
  <button id="planRemove" class="ghost" style="margin-top:10px" hidden>Remove from plan</button>
</section>

<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hanaro">
<title>Hanaro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="banner" role="status" aria-live="polite" hidden></div>

<section id="setup" hidden>
  <div class="setup-card">
    <div class="logo" aria-hidden="true"><img src="icon-192.png" alt="" width="64" height="64"></div>
    <h1>Hanaro</h1>
    <p class="muted">Paste the link and key you were given. They stay on this device only.</p>
    <label for="setupUrl">Link</label>
    <input id="setupUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="setupKey">Key</label>
    <input id="setupKey" type="password" autocomplete="off" autocapitalize="off" placeholder="Your personal key">
    <button id="setupGo" class="primary">Connect</button>
    <p id="setupMsg" class="err" role="alert"></p>
  </div>
</section>

<div id="app" hidden>
  <header>
    <div class="who">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div><div class="tiny muted">Welcome</div><div id="whoName" class="name"></div></div>
    </div>
    <button id="syncPill" class="pill" aria-label="Refresh">Syncing…</button>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav id="nav" hidden aria-label="Main">
  <button data-go="home" aria-label="Home"></button>
  <button data-go="review" aria-label="Review"></button>
  <button id="addBtn" class="add" aria-label="Add transaction">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button data-go="activity" aria-label="Activity"></button>
  <button data-go="status" aria-label="Status"></button>
</nav>

<div id="sheetBack" hidden></div>
<section id="sheet" hidden role="dialog" aria-modal="true" aria-label="Add transaction">
  <div class="grab" aria-hidden="true"></div>
  <div class="seg" role="tablist">
    <button id="kindSpent" class="on" role="tab">Spent</button>
    <button id="kindGot" role="tab">Received</button>
    <button id="kindHeld" role="tab">Held for others</button>
  </div>
  <label for="addAmount">Amount (Rp)</label>
  <input id="addAmount" inputmode="numeric" autocomplete="off" placeholder="0">
  <label for="addPayee" id="payeeLabel">Spent on</label>
  <input id="addPayee" autocomplete="off" placeholder="For example, lunch at the market">
  <div id="catWrap">
    <label for="addCat" id="catLabel">Category</label>
    <select id="addCat"></select>
    <div id="newTypeWrap" hidden><label for="addNewType">Name of the new kind</label><input id="addNewType" autocomplete="off" placeholder="For example, Seminar fees"></div>
    <p id="heldHint" class="note" hidden style="margin-top:8px">Money someone gave you to pass on. It is not your income and not counted in Safe to spend.</p>
  </div>
  <label for="addAcc" id="accLabel">Paid from</label>
  <select id="addAcc"></select>
  <label for="addMemo">Note (optional)</label>
  <input id="addMemo" autocomplete="off">
  <p id="addMsg" class="err" role="alert"></p>
  <div class="row"><button id="addCancel" class="ghost">Cancel</button><button id="addSave" class="primary">Save</button></div>
</section>

<script src="app.js"></script>
</body>
</html>
